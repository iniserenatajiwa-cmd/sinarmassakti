<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Detail Produk - SinarMasSakti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-save {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex flex-col min-h-screen" oncontextmenu="return false;">

    <header class="bg-gray-900 text-white py-4 px-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-black uppercase">SINARMAS<span class="text-red-600">SAKTI</span></h1>
            <a href="index.html" class="text-xs text-gray-300 hover:text-white font-bold">← Kembali ke Katalog</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10 flex-1 w-full">
        <div class="bg-white p-6 sm:p-10 rounded-2xl shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="relative">
                <img id="prod-img" src="" alt="Produk" class="w-full aspect-square object-cover rounded-xl border no-save" oncontextmenu="return false;">
            </div>
            <div class="space-y-6">
                <div>
                    <span id="prod-brand" class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded uppercase">Brand</span>
                    <h2 id="prod-name" class="text-2xl sm:text-3xl font-black text-gray-900 mt-2">Nama Produk</h2>
                    <p id="prod-sku" class="text-xs text-gray-400 font-mono mt-1">SKU: -</p>
                </div>
                
                <!-- Kotak Status Ketersediaan -->
                <div class="bg-gray-50 p-4 rounded-xl border">
                    <span class="text-sm font-bold text-gray-700">Status: Tersedia (Tanya Harga / Konsultasi)</span>
                </div>

                <!-- Ringkasan Ukuran Terpilih -->
                <div class="bg-gray-50 p-4 rounded-xl border flex items-center justify-between">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Ukuran Dipilih</span>
                    <span id="prod-ukuran" class="text-sm font-bold text-gray-900">-</span>
                </div>

                <!-- Wadah Kotak Terpisah untuk Tiap Ukuran -->
                <div id="varian-cards" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>

                <!-- Bagian Deskripsi Lengkap -->
                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Deskripsi & Spesifikasi:</h3>
                    <p id="prod-desc" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line">Memuat deskripsi...</p>
                </div>

                <div>
                    <a id="wa-btn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold text-sm transition flex items-center justify-center space-x-2 shadow-md">
                        <span>💬 Tanya Harga & Pesan via WhatsApp</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-xs border-t border-gray-800">
        <p>© 2026 SinarMasSakti. All Rights Reserved.</p>
    </footer>

    <script>
        function normalisasiPathGambar(path) {
            if (!path) return '';
            let clean = path.trim().replace(/^["']|["']$/g, '');
            if (clean.startsWith('http://') || clean.startsWith('https://') || clean.startsWith('./') || clean.startsWith('/')) {
                return clean;
            }
            if (clean.startsWith('images/')) {
                return './' + clean;
            }
            return './images/uploads/' + clean;
        }

        function siapkanVarianUkuran(parsed, defaultImg) {
            const labelUkuran = document.getElementById('prod-ukuran');
            const containerKartu = document.getElementById('varian-cards');
            const imgEl = document.getElementById('prod-img');

            containerKartu.innerHTML = '';

            if (!parsed.ukuran || parsed.ukuran.trim() === '-' || parsed.ukuran.trim() === '') {
                labelUkuran.innerText = '-';
                return;
            }

            const daftarUkuran = parsed.ukuran.split('|').map(item => item.trim()).filter(Boolean);
            const daftarGambar = parsed.gambar_ukuran
                ? parsed.gambar_ukuran.split('|').map(item => item.trim())
                : [];

            labelUkuran.innerText = daftarUkuran[0] || '-';

            if (daftarUkuran.length <= 1) {
                if (daftarGambar[0]) {
                    imgEl.src = normalisasiPathGambar(daftarGambar[0]);
                }
                return;
            }

            daftarUkuran.forEach((ukuran, index) => {
                const card = document.createElement('button');
                card.type = 'button';

                const setAktif = (aktif) => {
                    card.className = aktif
                        ? 'p-3 rounded-xl border-2 border-red-600 bg-red-50 text-left transition shadow-sm'
                        : 'p-3 rounded-xl border border-gray-200 bg-white hover:border-gray-400 text-left transition';
                };

                setAktif(index === 0);

                card.innerHTML = `
                    <div class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Varian ${index + 1}</div>
                    <div class="text-sm font-bold text-gray-900 mt-0.5">${ukuran}</div>
                `;

                card.addEventListener('click', () => {
                    containerKartu.querySelectorAll('button').forEach((otherCard, idx) => {
                        otherCard.className = 'p-3 rounded-xl border border-gray-200 bg-white hover:border-gray-400 text-left transition';
                        if (idx === index) {
                            setAktif(true);
                        }
                    });

                    labelUkuran.innerText = ukuran;
                    const gambarPilihan = daftarGambar[index] ? normalisasiPathGambar(daftarGambar[index]) : defaultImg;
                    imgEl.src = gambarPilihan;
                });

                containerKartu.appendChild(card);
            });
        }

        async function ambilDetailProduk() {
            const urlParams = new URLSearchParams(window.location.search);
            const namaFile = urlParams.get('id');

            if (!namaFile) { tampilkanError(); return; }

            try {
                let response = await fetch(`./content/produk/${namaFile}.md`);
                if (!response.ok) { tampilkanError(); return; }
                let text = await response.text();
                
                let parsed = parseMarkdown(text);

                if (parsed) {
                    const defaultImg = parsed.image ? normalisasiPathGambar(parsed.image) : 'logo-sinarmassakti.jpeg';

                    document.getElementById('page-title').innerText = (parsed.title || "Produk") + " - SinarMasSakti";
                    document.getElementById('prod-img').src = defaultImg;
                    document.getElementById('prod-brand').innerText = parsed.kategori || 'Industrial';
                    document.getElementById('prod-name').innerText = parsed.title || '-';
                    document.getElementById('prod-sku').innerText = "SKU: " + (parsed.sku || '-');

                    siapkanVarianUkuran(parsed, defaultImg);
                    
                    // Menampilkan isi bodi markdown secara utuh tanpa terpotong
                    document.getElementById('prod-desc').innerText = parsed.deskripsi || 'Tidak ada deskripsi.';
                    
                    let pesanWa = `Halo SinarMasSakti, saya tertarik dengan produk ${parsed.title} (SKU: ${parsed.sku || '-'}). Mohon info detail spesifikasi dan harganya.`;
                    document.getElementById('wa-btn').href = `https://wa.me/6285700976558?text=${encodeURIComponent(pesanWa)}`;
                } else { tampilkanError(); }
            } catch (error) { 
                tampilkanError(); 
            }
        }

        function parseMarkdown(mdText) {
            let parts = mdText.split('---');
            if (parts.length < 3) return null;
            
            let frontMatterLines = parts[1].trim().split('\n');
            let data = {};
            
            frontMatterLines.forEach(line => {
                let idx = line.indexOf(':');
                if (idx > -1) {
                    let k = line.substring(0, idx).trim();
                    let v = line.substring(idx + 1).trim().replace(/^["'](.*)["']$/, '$1');
                    data[k] = v;
                }
            });

            // Mengambil seluruh teks di bawah garis pemisah (---) sebagai deskripsi utuh
            let bodyText = parts.slice(2).join('---').trim();
            if (bodyText) {
                data.deskripsi = bodyText;
            }

            return data;
        }

        function tampilkanError() {
            document.querySelector('main').innerHTML = `<div class="text-center py-20 bg-white rounded-2xl border p-8"><h2 class="text-lg font-bold text-red-600">Produk tidak ditemukan.</h2><a href="index.html" class="text-blue-600 underline text-xs mt-4 inline-block font-bold">← Kembali ke Beranda</a></div>`;
        }

        ambilDetailProduk();
    </script>
</body>
</html>
