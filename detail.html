<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Detail Produk - SinarMasSakti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-save {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex flex-col min-h-screen" oncontextmenu="return false;">

    <header class="bg-gray-900 text-white py-4 px-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-black uppercase">SINARMAS<span class="text-red-600">SAKTI</span></h1>
            <a href="index.html" class="text-xs text-gray-300 hover:text-white font-bold">← Kembali ke Katalog</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10 flex-1 w-full">
        <div class="bg-white p-6 sm:p-10 rounded-2xl shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="relative">
                <img id="prod-img" src="" alt="Produk" class="w-full aspect-square object-cover rounded-xl border no-save" oncontextmenu="return false;">
            </div>
            <div class="space-y-6">
                <div>
                    <span id="prod-brand" class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded uppercase">Brand</span>
                    <h2 id="prod-name" class="text-2xl sm:text-3xl font-black text-gray-900 mt-2">Nama Produk</h2>
                    <p id="prod-sku" class="text-xs text-gray-400 font-mono mt-1">SKU: -</p>
                </div>
                
                <div class="bg-gray-50 p-4 rounded-xl border">
                    <span class="text-sm font-bold text-gray-700">Status: Tersedia (Tanya Harga / Konsultasi)</span>
                </div>

                <!-- Bagian Deskripsi Lengkap -->
                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Deskripsi & Spesifikasi:</h3>
                    <div id="prod-desc" class="text-sm text-gray-600 leading-relaxed space-y-2">Memuat deskripsi...</div>
                </div>

                <div>
                    <a id="wa-btn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold text-sm transition flex items-center justify-center space-x-2 shadow-md">
                        <span>💬 Tanya Harga & Pesan via WhatsApp</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-xs border-t border-gray-800">
        <p>© 2026 SinarMasSakti. All Rights Reserved.</p>
    </footer>

    <script>
        async function ambilDetailProduk() {
            const urlParams = new URLSearchParams(window.location.search);
            const namaFile = urlParams.get('id');

            if (!namaFile) { tampilkanError(); return; }

            try {
                let response = await fetch(`./content/produk/${namaFile}.md`);
                if (!response.ok) { tampilkanError(); return; }
                let text = await response.text();
                
                let parsed = parseMarkdown(text);

                if (parsed) {
                    document.getElementById('page-title').innerText = (parsed.title || "Produk") + " - SinarMasSakti";
                    document.getElementById('prod-img').src = parsed.image || 'logo-sinarmassakti.jpeg';
                    document.getElementById('prod-brand').innerText = parsed.kategori || 'Industrial';
                    document.getElementById('prod-name').innerText = parsed.title || '-';
                    document.getElementById('prod-sku').innerText = "SKU: " + (parsed.sku || '-');
                    
                    // Menampilkan seluruh deskripsi tanpa terpotong
                    let descContainer = document.getElementById('prod-desc');
                    if (parsed.description) {
                        let paragrafList = parsed.description.split('\n').filter(p => p.trim() !== '');
                        descContainer.innerHTML = paragrafList.map(p => `<p>${p}</p>`).join('');
                    } else {
                        descContainer.innerText = 'Tidak ada deskripsi.';
                    }
                    
                    let pesanWa = `Halo SinarMasSakti, saya tertarik dengan produk ${parsed.title} (SKU: ${parsed.sku || '-'}). Mohon info detail spesifikasi dan harganya.`;
                    document.getElementById('wa-btn').href = `https://wa.me/6285700976558?text=${encodeURIComponent(pesanWa)}`;
                } else { tampilkanError(); }
            } catch (error) { 
                tampilkanError(); 
            }
        }

        function parseMarkdown(mdText) {
            let parts = mdText.split('---');
            if (parts.length < 3) return null;
            
            let frontMatterLines = parts[1].trim().split('\n');
            let data = {};
            
            frontMatterLines.forEach(line => {
                let idx = line.indexOf(':');
                if (idx > -1) {
                    let k = line.substring(0, idx).trim();
                    let v = line.substring(idx + 1).trim().replace(/^["'](.*)["']$/, '$1');
                    data[k] = v;
                }
            });

            // Menggabungkan seluruh bagian setelah frontmatter sebagai deskripsi utuh
            let bodyText = parts.slice(2).join('---').trim();
            data.description = bodyText || data.deskripsi || '';

            return data;
        }

        function tampilkanError() {
            document.querySelector('main').innerHTML = `<div class="text-center py-20 bg-white rounded-2xl border p-8"><h2 class="text-lg font-bold text-red-600">Produk tidak ditemukan.</h2><a href="index.html" class="text-blue-600 underline text-xs mt-4 inline-block font-bold">← Kembali ke Beranda</a></div>`;
        }

        ambilDetailProduk();
    </script>
</body>
</html>
